# Production stack for the VPS (/opt/casino-bot). The image is pulled from
# GHCR; `IMAGE_TAG=<sha>` pins a specific build for rollbacks.
services:
  bot:
    image: ghcr.io/dadadadas111/casino-bot:${IMAGE_TAG:-latest}
    container_name: casino-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/casino.db
    # SePay webhook, reachable only through the host's nginx.
    ports:
      - "127.0.0.1:3020:3020"
    volumes:
      - ./data:/app/data
    # Unbounded json logs will eventually fill the VPS disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
